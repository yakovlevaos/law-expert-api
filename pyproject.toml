[project]
name = "genesis"
version = "0.1.0"
description = "Read-only REST API for a video games catalog"
authors = [{ name = "Alexander", email = "job.yakovlev.alexander@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.15.2,<4",
    "django-filter>=24.3,<25",
    "pillow>=11,<12",
    "psycopg2-binary>=2.9.10,<3",
    "django-environ>=0.11.2,<0.12",
    "drf-spectacular>=0.27.2,<0.28",
    "django-cors-headers>=4.6,<5",
]

# PEP 735 groups. `uv sync` installs them by default; the production image
# installs only the top-level dependencies with `--no-default-groups`.
[dependency-groups]
# uWSGI ships no wheels and is always compiled from source, which is slow and
# brittle on CI runners. Nothing outside the production image needs it, so it
# lives in its own group: `uv sync` skips it, the Dockerfile asks for it.
prod = ["uwsgi>=2.0.28,<3"]
dev = [
    "nplusone>=1,<2",
    "django-debug-toolbar>=4.4.6,<5",
    "ruff>=0.8.1",
    "ty>=0.0.75,<0.1",
    "django-types>=0.24",
    "djangorestframework-types>=0.9",
]

# No [build-system]: this is an application, not a distributable package, so
# uv treats it as a virtual project and never builds or installs it.

[tool.ty.environment]
# Django code lives under src/, so `apps.*` and `config.*` are importable only
# with src/ on the path -- same as manage.py sets up at runtime.
root = ["./src"]
python-version = "3.12"
# Point ty at the uv-managed venv explicitly. `uv run ty` sets VIRTUAL_ENV so it
# auto-discovers .venv, but the IDE extension runs ty without that activation and
# would otherwise fall back to a system interpreter with no third-party packages.
python = ".venv"

[tool.ty.src]
exclude = ["volumes", "**/migrations"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["migrations", ".venv", "volumes"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "DJ",   # flake8-django
    "C4",   # comprehensions
    "RUF",
]
ignore = [
    # Django declares plenty of mutable class attributes (Meta.ordering,
    # list_display, fields, ...) -- ClassVar annotations there are noise.
    "RUF012",
    # The catalog content and the verbose names are Russian on purpose.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"src/helpers/fill_db.py" = ["E501", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "helpers"]
