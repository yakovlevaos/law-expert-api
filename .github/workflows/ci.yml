name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: genesis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret-key-not-used-anywhere-else
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: psql://postgres:postgres@localhost:5432/genesis

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.5"
          enable-cache: true

      - name: Install dependencies
        # --locked fails if uv.lock is out of date with pyproject.toml.
        run: uv sync --locked

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run ty check

      - name: Check for missing migrations
        run: uv run python src/manage.py makemigrations --check --dry-run

      - name: Django deployment checklist
        run: uv run python src/manage.py check --deploy --fail-level ERROR

      - name: Tests
        run: uv run python src/manage.py test apps

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t genesis:ci .

  deploy:
    # Only a green push to main reaches the server; pull requests never deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-latest
    # Configure this environment in the repository settings to require a
    # reviewer if the first deploys should be approved by hand.
    environment: production
    # Never let two deploys race. Queue rather than cancel, so an older commit
    # cannot overtake a newer one that is already rolling out.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_deploy \
              -p "${{ secrets.DEPLOY_PORT || 22 }}" \
              -o BatchMode=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "cd '${{ secrets.DEPLOY_PATH }}' && ./deploy/deploy.sh"
