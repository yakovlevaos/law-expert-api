---

services:
  postgres_db:
    container_name: "genesis-postgres"
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # Alpine/musl keeps the byte-order collation the catalog was sorted with;
      # switching to a glibc image would silently reorder the games list.
      - LANG=en_US.utf8
    ports:
      # Bound to loopback: the database must not be reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - ./deploy/postgres_db:/docker-entrypoint-initdb.d
      - ./volumes/postgres_db:/var/lib/postgresql/data/
    networks:
      - genesis-backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d genesis"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    profiles:
      - prod
      - dev

  server:
    container_name: "genesis-api-server"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8099:8099"
    depends_on:
      postgres_db:
        # Without this the entrypoint's `migrate` races the database startup.
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Overrides values from .env so that a single .env serves both local
      # development and the Docker stack.
      #   - inside the compose network the database is `postgres_db`, not
      #     localhost;
      #   - the `prod` profile must never run with DEBUG on: the image ships
      #     no debug tooling.
      DATABASE_URL: "psql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/genesis"
      DEBUG: "false"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
    volumes:
      # Only the data volume is mounted; the application code lives in the
      # image so the container is reproducible.
      - ./volumes/data:/volumes/data
    networks:
      genesis-backend-net:
        ipv4_address: 172.28.0.57
    restart: unless-stopped
    profiles:
      - prod

networks:
  genesis-backend-net:
    driver: bridge
    ipam:
      config:
        # RFC 1918 private range. The previous 177.129.0.0/24 is publicly
        # routable address space and shadowed real hosts.
        - subnet: 172.28.0.0/24
