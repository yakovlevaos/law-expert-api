[uwsgi]
chdir = /server
module = config.wsgi:application

http = :8099
master = true
processes = 3
harakiri = 20
max-requests = 5000
vacuum = true
die-on-term = true
buffer-size = 16384

; uWSGI serves the collected static and media files itself; without these
; mappings /static/ and /cdn/ are 404 in production.
static-map = /static=/volumes/data/static
static-map = /cdn=/volumes/data/cdn

; Docker's HEALTHCHECK calls /health/ every 30s from inside the container,
; which would add ~2880 identical lines a day to the request log. Drop the
; successful ones and keep everything else -- a failing check still logs.
; (final-route runs after the response, before the log line is written;
; `final-route-status` compares the exact status, not a regexp.)
final-route = ^/health/$ goto:health
final-route-run = last:
final-route-label = health
final-route-if = equal:${uwsgi[status]};200 donotlog:
